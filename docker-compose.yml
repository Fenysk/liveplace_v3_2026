# La seule description du déploiement (D-10, §11.1) : Dokploy l'exécute, il ne l'écrit pas.
#
# Les variables viennent de l'onglet Environment du Compose dans Dokploy. Chaque service ne reçoit que
# ce que son `config.ts` lit, et `${NOM:?}` fait échouer le déploiement s'il en manque une
# (§11.1). Aucun port n'est publié : Traefik est le seul point d'entrée.
#
# Ne jamais renommer le projet Compose : le volume de Redis porte son nom, et l'AOF avec.
#
# Écart §11.1 (JOURNAL 2026-10-04) : le même fichier sert aussi aux emplacements de bêta, un Compose
# chacun. `ROUTER_PREFIX` y distingue les routeurs Traefik, et `BETA_LABEL` y pose le bandeau.
# Labels en liste : Compose ne remplace pas une variable dans le nom d'une clé.

services:
  redis:
    image: redis:7-alpine
    # AOF à la seconde, et jamais d'éviction : un canvas ne disparaît pas en silence (§11.3).
    # Écart §11.3 (JOURNAL 2026-10-07) : le plafond se règle par Compose, 512 Mo par défaut (les bêtas).
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP: gateway
    environment:
      REDIS_URL: ${REDIS_URL:?REDIS_URL manquante}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquante}
      BROADCAST_HZ: ${BROADCAST_HZ:-10}
      # JOURNAL 2026-09-29 : la seule origine d'où une page ouvre le WebSocket.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL manquante}
      # Écart §10.3 (JOURNAL 2026-10-06) : vide en production, où les onglets du développeur ne comptent pas.
      BETA_LABEL: ${BETA_LABEL:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [default, dokploy-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Règle plus longue que celle du web, donc prioritaire. `Path` et non `PathPrefix` : `/ws_pseudo` est une page.
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-ws.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquante}`) && Path(`/ws`)
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-ws.entrypoints=websecure
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-ws.service=${ROUTER_PREFIX:-liveplace}-ws
      - traefik.http.services.${ROUTER_PREFIX:-liveplace}-ws.loadbalancer.server.port=8080

  # §7 : un seul process, sans port publié. Sa santé est son battement dans Redis (`worker:heartbeat`, §7.5).
  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP: worker
    environment:
      REDIS_URL: ${REDIS_URL:?REDIS_URL manquante}
      CONVEX_URL: ${CONVEX_URL:?CONVEX_URL manquante}
      CONVEX_SERVICE_KEY: ${CONVEX_SERVICE_KEY:?CONVEX_SERVICE_KEY manquante}
      # Écart §11.5 (JOURNAL 2026-10-06) : `prod`, `beta`… ou `off` écrit exprès. Sans défaut : jamais deux environnements mêlés.
      DURABLE_SCOPE: ${DURABLE_SCOPE:?DURABLE_SCOPE manquante}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL manquante}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquante}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?TWITCH_CLIENT_ID manquante}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?TWITCH_CLIENT_SECRET manquante}
      CONVEX_URL: ${CONVEX_URL:?CONVEX_URL manquante}
      CONVEX_SERVICE_KEY: ${CONVEX_SERVICE_KEY:?CONVEX_SERVICE_KEY manquante}
      REDIS_URL: ${REDIS_URL:?REDIS_URL manquante}
      # JOURNAL 2026-09-27 : la signature des messages que Twitch poste sur /twitch/eventsub.
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:?TWITCH_EVENTSUB_SECRET manquante}
      # Vide en production : ni bandeau, ni `noindex`.
      BETA_LABEL: ${BETA_LABEL:-}
      # Écart §2 et §9 (JOURNAL 2026-10-07) : facultative, des paires « URL clé » ; sans elle, Convex n'est pas mesuré.
      CONVEX_USAGE_DEPLOYMENTS: ${CONVEX_USAGE_DEPLOYMENTS:-}
      # Écart §7.2 (JOURNAL 2026-10-08) : celui du worker. La connexion ne recrée pas vide un canvas dont ce scope a une sauvegarde.
      DURABLE_SCOPE: ${DURABLE_SCOPE:?DURABLE_SCOPE manquante}
    # Le callback OAuth crée le canvas dans Redis (§10.1).
    depends_on:
      redis:
        condition: service_healthy
    networks: [default, dokploy-network]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-web.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquante}`)
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-web.entrypoints=websecure
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-web.tls.certresolver=letsencrypt
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-web.service=${ROUTER_PREFIX:-liveplace}-web
      - traefik.http.services.${ROUTER_PREFIX:-liveplace}-web.loadbalancer.server.port=3000
      # HTTP → HTTPS, par le middleware que Dokploy déclare déjà côté Traefik.
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-http.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquante}`)
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-http.entrypoints=web
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-http.middlewares=redirect-to-https@file
      - traefik.http.routers.${ROUTER_PREFIX:-liveplace}-http.service=${ROUTER_PREFIX:-liveplace}-web

volumes:
  redis-data:

networks:
  dokploy-network:
    external: true
