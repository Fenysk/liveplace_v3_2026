# Poste de développement (§11.7) : Redis seul. Les trois apps tournent en `pnpm dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Le port est publié ici, contrairement à la production où aucun port ne l'est : les apps
# en `pnpm dev` tournent sur l'hôte. Les tests n'y touchent pas (JOURNAL 2026-10-11).
services:
  redis:
    image: redis:7-alpine
    container_name: liveplace-dev-redis
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

volumes:
  redis-dev-data:
